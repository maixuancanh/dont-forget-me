<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
		<title>DON'T FORGET ME</title>
		
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: black;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: #242424;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}
		
@font-face{font-family:Charcoal;src:url('loading/Charcoal-Regular.ttf') format('truetype');font-display:swap}
#status{visibility:visible;background:#35342b url('loading/street.png') center/cover no-repeat;z-index:100;isolation:isolate;font-family:Charcoal,Georgia,serif;text-align:center}
#status:before{content:'';position:absolute;inset:0;background:rgba(20,24,20,.64);z-index:-1}
#status-splash{display:none!important}
#loading-title{width:min(58vw,520px);max-height:45vh;object-fit:contain;filter:drop-shadow(0 5px 0 rgba(0,0,0,.25))}
#loading-copy{color:#fff5dc;font-size:clamp(20px,3vw,28px);margin:28px 20px 12px;line-height:1.4}
#status-progress{position:static;width:min(65vw,440px);height:20px;margin:0 auto;border:3px solid #221e18;border-radius:4px;background:#554b3c;appearance:none;overflow:hidden;box-shadow:0 0 0 2px #b2a287}
#status-progress::-webkit-progress-bar{background:#554b3c}
#status-progress::-webkit-progress-value{background:#e8d9b4}
#status-progress::-moz-progress-bar{background:#e8d9b4}
#loading-percent{color:#fff5dc;font-size:21px;margin:14px 0;min-height:28px}
#status-notice{font-family:Charcoal,Georgia,serif;background:#efe1bd;color:#28231b;border:3px solid #332a20;border-radius:3px;max-width:600px;font-size:20px}
#loading-retry{font-family:inherit;font-size:20px;color:#fff5dc;background:#7b3229;border:2px solid #c6b28a;padding:10px 28px;margin-top:16px;cursor:pointer}
@media(prefers-reduced-motion:reduce){#status-progress{transition:none}}
</style>
		<link id="-gd-engine-icon" rel="icon" type="image/png" href="favicon.png?v=dfm-ledger-1" />
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=dfm-ledger-1"/>

	</head>
	<body>
		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>

		<noscript>
			Your browser does not support JavaScript.
		</noscript>

		<div id="status">
			<img id="status-splash" class="show-image--true fullsize--true use-filter--true" src="index.png" alt="">
			<img id="loading-title" src="loading/title.png" alt="DON’T FORGET ME">
<p id="loading-copy" role="status">Opening the shop…</p>
<progress id="status-progress" aria-label="Downloading game"></progress>
<div id="loading-percent">Loading…</div>
			<div id="status-notice"></div>
		</div>

		<script src="index.js"></script>
		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":53969628,"index.wasm":39514754},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');
 const loadingCopy=document.getElementById('loading-copy');
 const loadingPercent=document.getElementById('loading-percent');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
 loadingCopy.textContent='The shop could not open.';
 loadingPercent.textContent='Check your connection and try again.';
 const retry=document.createElement('button');retry.id='loading-retry';retry.textContent='Try again';retry.onclick=()=>window.location.reload();statusOverlay.appendChild(retry);
 if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		Promise.all(['loading/title.png','loading/street.png'].map(src=>new Promise(resolve=>{const img=new Image();img.onload=resolve;img.onerror=resolve;img.src=src;}))).then(()=>engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
 const percent=Math.min(100,Math.floor(current/total*100));
 loadingPercent.textContent=percent+'%';
 loadingCopy.textContent=percent===100?'Preparing your shop…':'Opening the shop…';
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		})).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>
	</body>
</html>
